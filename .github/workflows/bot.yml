name: Bot VIE

# Un seul workflow : il rafraichit le token SI besoin, puis lance le bot.
# Motif : les deux crons GitHub sont throttles independamment (le refresh
# */50 tournait en realite toutes les 8-10h), donc le bot se retrouvait avec
# un token expire et prenait des HTTP 401 la majorite du temps.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-vie
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Etat persistant entre les runs (sinon : quota journalier remis a zero,
      # offres deja vues oubliees, risque de double candidature).
      - name: Restaurer l'etat
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_offers.json
            applied_offers.json
            applied_log.json
            pending_review.json
          key: vie-state-${{ github.run_id }}
          restore-keys: |
            vie-state-

      - name: Token encore valide ?
        id: tok
        env:
          TOKEN_EXPIRES_AT: ${{ vars.VIE_TOKEN_EXPIRES_AT }}
        run: |
          python - <<'PY'
          import os, time
          raw = (os.environ.get("TOKEN_EXPIRES_AT") or "").strip()
          try:
              exp = float(raw or 0)
          except ValueError:
              exp = 0.0
          left = int(exp - time.time())
          print(f"Token restant: {left}s")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"need_refresh={'true' if left < 1200 else 'false'}\n")
          PY

      - name: Rafraichir le token (Playwright)
        if: steps.tok.outputs.need_refresh == 'true'
        continue-on-error: true
        env:
          MS_EMAIL:           ${{ secrets.MS_EMAIL }}
          MS_PASSWORD:        ${{ secrets.MS_PASSWORD }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_PAT:             ${{ secrets.GH_PAT }}
          GITHUB_REPO:        ${{ github.repository }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python playwright_login.py

      # GH_PAT plutot que les valeurs de vars : le contexte `vars` est fige au
      # demarrage du run, donc il contiendrait encore l'ancien token. auth.py
      # relit les Repository Variables via l'API a chaque cycle.
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          GITHUB_REPO:         ${{ github.repository }}
          AUTO_APPLY:          'true'
          MAX_DAILY_APPLIES:   '15'
          MAX_RUNTIME_SEC:     '240'
          MIN_INTERVAL:        '30'
          MAX_INTERVAL:        '60'
        run: python main.py

      - name: Sauvegarder l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_offers.json
            applied_offers.json
            applied_log.json
            pending_review.json
          key: vie-state-${{ github.run_id }}

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          if-no-files-found: ignore
          retention-days: 3
